services:
  # Backend Web Service
  - type: web
    name: coincraft-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: coincraft-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: coincraft-api.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://coincraft-web.onrender.com,http://localhost:5173
      - key: USE_SQLITE
        value: "False"

  # Frontend Static Site
  - type: web
    name: coincraft-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://coincraft-api.onrender.com/api/

databases:
  # Managed PostgreSQL Database
  - name: coincraft-postgres
    databaseName: coincraft_db
    user: coincraft_user
    plan: free
